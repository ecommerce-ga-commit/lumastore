<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Luma Cart</title>
  <meta
    name="description"
    content="Create your Luma Cart account."
  >

       DATA LAYER
  ========================================== -->

    window.dataLayer = window.dataLayer || [];

    window.dataLayer.push({
      user_id: localStorage.getItem('user_id') || null,
      user_type: localStorage.getItem('user_id') ? 'loggedin' : 'guest',
      page_type: 'registration'
    });
  </script>

  <!-- =========================================
       GOOGLE TAG MANAGER
  ========================================== -->
  <script>
    (function(w,d,s,l,i){
      w[l]=w[l]||[];
      w[l].push({
        'gtm.start': new Date().getTime(),
        event:'gtm.js'
      });

      var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),
          dl=l!='dataLayer'?'&l='+l:'';

      j.async=true;
      j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;

      f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-KWVHQDHK');
  </script>

  <!-- Existing Luma stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    /* =========================================
       REGISTRATION PAGE
    ========================================== */

    .registration-section {
      min-height: calc(100vh - 180px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
      background: #f8f8f8;
    }

    .registration-card {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    .registration-card h1 {
      margin-bottom: 10px;
      text-align: center;
    }

    .registration-subtitle {
      text-align: center;
      margin-bottom: 30px;
      color: #666;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: #222;
    }

    .signup-method-title {
      font-weight: 600;
      margin-bottom: 10px;
    }

    .signup-methods {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .signup-method {
      flex: 1;
      min-width: 100px;
      padding: 12px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .signup-method:hover {
      border-color: #222;
    }

    .signup-method.active {
      background: #222;
      color: #fff;
      border-color: #222;
    }

    .create-account-btn {
      width: 100%;
      padding: 14px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .create-account-btn:hover {
      opacity: 0.9;
    }

    .create-account-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 6px;
      font-size: 14px;
    }

    .error-message {
      background: #ffeaea;
      color: #b00020;
      border: 1px solid #ffbaba;
    }

    .success-message {
      background: #eaf8ed;
      color: #187a2f;
      border: 1px solid #b8e6c1;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
    }

    .login-link a {
      color: #222;
      font-weight: 600;
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .registration-card {
        padding: 25px 20px;
      }

      .signup-method {
        min-width: 80px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================
       GTM NOSCRIPT
  ========================================== -->
  <noscript>
    <iframe
      src="https://www.googletagmanager.com/ns.html?id=GTM-KWVHQDHK"
      height="0"
      width="0"
      style="display:none;visibility:hidden">
    </iframe>
  </noscript>

  <!-- =========================================
       HEADER
  ========================================== -->
  <header>
    <nav>
      <a href="index.html">Luma Cart</a>

      <div>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="video.html">Video</a>
        <a href="account.html">Account</a>
        <a href="login.html">Login</a>
      </div>
    </nav>
  </header>

  <!-- =========================================
       REGISTRATION FORM
  ========================================== -->
  <main class="registration-section">

    <div class="registration-card">

      <h1>Create Account</h1>

      <p class="registration-subtitle">
        Create your Luma Cart account to continue.
      </p>

      <!-- Error Message -->
      <div
        id="errorMessage"
        class="message error-message">
      </div>

      <!-- Success Message -->
      <div
        id="successMessage"
        class="message success-message">
      </div>

      <form id="registrationForm">

        <!-- Username -->
        <div class="form-group">
          <label for="username">
            Username
          </label>

          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
          >
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
          >
        </div>

        <!-- Phone -->
        <div class="form-group">
          <label for="phone">
            Phone Number
          </label>

          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            autocomplete="tel"
          >
        </div>

        <!-- Signup Method -->
        <div class="form-group">

          <div class="signup-method-title">
            Sign-up Method
          </div>

          <div class="signup-methods">

            <button
              type="button"
              class="signup-method"
              data-method="Email">
              Email
            </button>

            <button
              type="button"
              class="signup-method"
              data-method="Google">
              Google
            </button>

            <button
              type="button"
              class="signup-method"
              data-method="Facebook">
              Facebook
            </button>

          </div>

        </div>

        <!-- Create Account -->
        <button
          type="submit"
          id="createAccountBtn"
          class="create-account-btn">
          Create Account
        </button>

      </form>

      <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

    </div>

  </main>

  <!-- =========================================
       FOOTER
  ========================================== -->
  <footer>
    <p>&copy; 2026 Luma Cart. All rights reserved.</p>
  </footer>


  <!-- =========================================
       REGISTRATION JAVASCRIPT
  ========================================== -->
  <script>

    const registrationForm =
      document.getElementById('registrationForm');

    const usernameInput =
      document.getElementById('username');

    const emailInput =
      document.getElementById('email');

    const phoneInput =
      document.getElementById('phone');

    const createAccountBtn =
      document.getElementById('createAccountBtn');

    const errorMessage =
      document.getElementById('errorMessage');

    const successMessage =
      document.getElementById('successMessage');

    const signupMethodButtons =
      document.querySelectorAll('.signup-method');


    let signupMethod = null;


    /* =========================================
       SIGNUP METHOD SELECTION
    ========================================== */

    signupMethodButtons.forEach(button => {

      button.addEventListener('click', function () {

        signupMethodButtons.forEach(btn => {
          btn.classList.remove('active');
        });

        this.classList.add('active');

        signupMethod =
          this.getAttribute('data-method');

      });

    });


    /* =========================================
       SHA-256 HASH FUNCTION
    ========================================== */

    async function sha256(value) {

      const encoder =
        new TextEncoder();

      const data =
        encoder.encode(value);

      const hashBuffer =
        await crypto.subtle.digest(
          'SHA-256',
          data
        );

      const hashArray =
        Array.from(
          new Uint8Array(hashBuffer)
        );

      return hashArray
        .map(
          byte =>
            byte
              .toString(16)
              .padStart(2, '0')
        )
        .join('');

    }


    /* =========================================
       NORMALIZE USERNAME
    ========================================== */

    function normalizeUsername(username) {

      return username
        .trim()
        .toLowerCase();

    }


    /* =========================================
       NORMALIZE EMAIL
    ========================================== */

    function normalizeEmail(email) {

      return email
        .trim()
        .toLowerCase();

    }


    /* =========================================
       NORMALIZE PHONE
    ========================================== */

    function normalizePhone(phone) {

      let normalizedPhone =
        phone
          .trim()
          .replace(
            /[\s\-()]/g,
            ''
          );

      /*
        If user enters a 10-digit
        Indian phone number,
        add +91.
      */

      if (
        /^[0-9]{10}$/.test(
          normalizedPhone
        )
      ) {

        normalizedPhone =
          '+91' + normalizedPhone;

      }

      return normalizedPhone;

    }


    /* =========================================
       SHOW ERROR
    ========================================== */

    function showError(message) {

      errorMessage.textContent =
        message;

      errorMessage.style.display =
        'block';

      successMessage.style.display =
        'none';

    }


    /* =========================================
       SHOW SUCCESS
    ========================================== */

    function showSuccess(message) {

      successMessage.textContent =
        message;

      successMessage.style.display =
        'block';

      errorMessage.style.display =
        'none';

    }


    /* =========================================
       HIDE MESSAGES
    ========================================== */

    function hideMessages() {

      errorMessage.style.display =
        'none';

      successMessage.style.display =
        'none';

    }


    /* =========================================
       FORM SUBMISSION
    ========================================== */

    registrationForm.addEventListener(
      'submit',
      async function(event) {

        event.preventDefault();

        hideMessages();

        createAccountBtn.disabled =
          true;

        createAccountBtn.textContent =
          'Creating Account...';


        /* =====================================
           GET FORM VALUES
        ====================================== */

        const username =
          normalizeUsername(
            usernameInput.value
          );

        const email =
          normalizeEmail(
            emailInput.value
          );

        const phone =
          normalizePhone(
            phoneInput.value
          );


        let failureReason = null;


        /* =====================================
           VALIDATION
        ====================================== */

        if (!username) {

          failureReason =
            'username_missing';

        }

        else if (!email) {

          failureReason =
            'email_missing';

        }

        else if (
          !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(email)
        ) {

          failureReason =
            'invalid_email';

        }

        else if (!phone) {

          failureReason =
            'phone_missing';

        }

        else if (
          !/^\+?[0-9]{10,15}$/
            .test(phone)
        ) {

          failureReason =
            'invalid_phone';

        }

        else if (!signupMethod) {

          failureReason =
            'signup_method_missing';

        }


        /* =====================================
           HASH USER DATA
        ====================================== */

        let hashedUsername = null;
        let hashedEmail = null;
        let hashedPhone = null;


        if (username) {

          hashedUsername =
            await sha256(
              username
            );

        }


        if (email) {

          hashedEmail =
            await sha256(
              email
            );

        }


        if (phone) {

          hashedPhone =
            await sha256(
              phone
            );

        }


        /* =====================================
           VALIDATION FAILURE
        ====================================== */

        if (failureReason) {

          window.dataLayer.push({

            event:
              'registration_failed',

            username:
              hashedUsername,

            email:
              hashedEmail,

            phone_number:
              hashedPhone,

            signup_method:
              signupMethod || null,

            failure_reason:
              failureReason

          });


          showError(
            'Registration failed: ' +
            failureReason.replace(
              /_/g,
              ' '
            )
          );


          /*
            IMPORTANT:
            Do NOT clear the form.
            User-entered values remain.
          */

          createAccountBtn.disabled =
            false;

          createAccountBtn.textContent =
            'Create Account';

          return;

        }


        /* =====================================
           SIMULATE REGISTRATION REQUEST
        ====================================== */

        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              1000
            )
        );


        /* =====================================
           SIMULATED SERVER FAILURE

           20% chance of failure
        ====================================== */

        const serverFailed =
          Math.random() < 0.20;


        if (serverFailed) {

          failureReason =
            'registration_server_error';


          window.dataLayer.push({

            event:
              'registration_failed',

            username:
              hashedUsername,

            email:
              hashedEmail,

            phone_number:
              hashedPhone,

            signup_method:
              signupMethod,

            failure_reason:
              failureReason

          });


          showError(
            'Registration failed. Please try again.'
          );


          /*
            Keep form values filled
          */

          createAccountBtn.disabled =
            false;

          createAccountBtn.textContent =
            'Create Account';

          return;

        }


        /* =====================================
           REGISTRATION SUCCESS
        ====================================== */

        window.dataLayer.push({

          event:
            'registration_success',

          username:
            hashedUsername,

          email:
            hashedEmail,

          phone_number:
            hashedPhone,

          signup_method:
            signupMethod,

          failure_reason:
            null

        });


        /* =====================================
           CREATE USER ID
        ====================================== */

        const userId =
          'user_' +
          Date.now() +
          '_' +
          Math.random()
            .toString(36)
            .substring(2, 10);


        localStorage.setItem(
          'user_id',
          userId
        );


        localStorage.setItem(
          'user_type',
          'loggedin'
        );


        /* =====================================
           SUCCESS MESSAGE
        ====================================== */

        showSuccess(
          'Account created successfully!'
        );


        createAccountBtn.disabled =
          false;

        createAccountBtn.textContent =
          'Create Account';


        /*
          Form values are intentionally
          NOT cleared here either.
        */

      }
    );

  </script>

</body>
</html>
